<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brazilian Sensi AI - Free Fire MAX</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            color: #00ff9d;
            font-family: 'Press Start 2P', cursive;
            min-height: 100vh;
        }
        .header {
            background: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #00ff9d;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            text-shadow: 0 0 20px #00ff9d;
        }
        .search-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
        }
        input {
            width: 100%;
            padding: 20px;
            font-size: 1.2em;
            background: #111;
            border: 3px solid #00ff9d;
            color: #00ff9d;
            border-radius: 0;
        }
        .suggestions {
            background: #111;
            border: 3px solid #00ff9d;
            max-height: 300px;
            overflow-y: auto;
        }
        .result {
            display: none;
            margin-top: 40px;
            padding: 30px;
            background: #111;
            border: 4px solid #00ff9d;
            text-align: center;
        }
        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .setting {
            background: #1a1a1a;
            padding: 15px;
            border: 2px solid #00ff9d;
        }
        button {
            background: #00ff9d;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>BRAZILIAN SENSI AI</h1>
        <p>FREE FIRE MAX - BEST SENSITIVITY</p>
    </div>

    <div class="search-container">
        <input type="text" id="search" placeholder="Search your device... e.g. Redmi Note 13 Pro" onkeyup="handleSearch()">
        <div id="suggestions" class="suggestions"></div>

        <div id="result" class="result">
            <h2 id="device-name"></h2>
            <div class="settings" id="settings"></div>
            <button onclick="resetSearch()">Search Another Device</button>
        </div>
    </div>

    <script>
        // Huge database of devices
        let database = {
            "Realme C51": { general: 98, reddot: 94, scope2x: 87, scope4x: 75, sniper: 52, freelook: 90, dpi: 640 },
            "Redmi Note 13 Pro": { general: 95, reddot: 92, scope2x: 85, scope4x: 72, sniper: 48, freelook: 88, dpi: 720 },
            "Poco X6 Pro": { general: 102, reddot: 97, scope2x: 90, scope4x: 78, sniper: 55, freelook: 95, dpi: 800 },
            "Samsung Galaxy A15": { general: 90, reddot: 88, scope2x: 82, scope4x: 70, sniper: 45, freelook: 85, dpi: 600 },
            // Add more here... over 500+ can be added
        };

        function handleSearch() {
            const query = document.getElementById('search').value.toLowerCase().trim();
            const suggestionsDiv = document.getElementById('suggestions');
            suggestionsDiv.innerHTML = '';

            if (query.length < 2) return;

            const matches = Object.keys(database).filter(device => 
                device.toLowerCase().includes(query)
            );

            matches.forEach(match => {
                const div = document.createElement('div');
                div.textContent = match;
                div.style.padding = '12px';
                div.style.cursor = 'pointer';
                div.style.borderBottom = '1px solid #00ff9d';
                div.onclick = () => selectDevice(match);
                suggestionsDiv.appendChild(div);
            });
        }

        function selectDevice(device) {
            document.getElementById('suggestions').innerHTML = '';
            document.getElementById('search').value = device;

            const settings = database[device] || generateSettings(device);
            // Save if new
            if (!database[device]) database[device] = settings;

            showResult(device, settings);
        }

        function generateSettings(device) {
            // Simple logic for new devices
            return {
                general: 95,
                reddot: 90,
                scope2x: 84,
                scope4x: 73,
                sniper: 50,
                freelook: 88,
                dpi: 720
            };
        }

        function showResult(device, settings) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            document.getElementById('device-name').textContent = device;

            const settingsDiv = document.getElementById('settings');
            settingsDiv.innerHTML = `
                <div class="setting"><strong>General</strong><br>${settings.general}</div>
                <div class="setting"><strong>Red Dot</strong><br>${settings.reddot}</div>
                <div class="setting"><strong>2x Scope</strong><br>${settings.scope2x}</div>
                <div class="setting"><strong>4x Scope</strong><br>${settings.scope4x}</div>
                <div class="setting"><strong>Sniper Scope</strong><br>${settings.sniper}</div>
                <div class="setting"><strong>Free Look</strong><br>${settings.freelook}</div>
                <div class="setting"><strong>DPI</strong><br>${settings.dpi}</div>
            `;
        }

        function resetSearch() {
            document.getElementById('result').style.display = 'none';
            document.getElementById('search').value = '';
            document.getElementById('search').focus();
        }
    </script>
</body>
</html>
