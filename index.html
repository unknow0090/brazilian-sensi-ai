<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Brazilian Sensi AI - Free Fire MAX</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');body{font-family:'Press Start 2P',system-ui;}.neon-green{text-shadow:0 0 10px #39ff14,0 0 20px #39ff14;}.glass{background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);}</style></head><body class="bg-black text-white"><div class="min-h-screen p-6"><header class="text-center mb-12"><div class="flex justify-center items-center gap-4 mb-4"><div class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center text-4xl">🇧🇷</div><h1 class="text-5xl font-bold neon-green">BRAZILIAN SENSI AI</h1></div><p class="text-green-400 text-xl">FREE FIRE MAX SENSITIVITY SETTINGS</p></header><div class="max-w-2xl mx-auto"><div class="glass p-8 rounded-3xl border border-green-500"><input id="search" type="text" placeholder="Search your phone e.g. Redmi Note 13 Pro" class="w-full bg-black border border-green-500 rounded-2xl px-6 py-5 text-lg mb-4 focus:outline-none" onkeypress="if(event.key==='Enter') searchDevice()"><button onclick="searchDevice()" class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-4 rounded-2xl text-xl">GET SETTINGS</button></div><div id="result" class="hidden mt-8 glass p-8 rounded-3xl"></div></div></div><script>let db = {"realme c51":{general:98,redDot:94,scope2x:87,scope4x:75,sniper:52,freeLook:90,dpi:640},"redmi note 13 pro":{general:95,redDot:92,scope2x:85,scope4x:72,sniper:48,freeLook:88,dpi:720}};
function searchDevice(){const q=document.getElementById('search').value.toLowerCase().trim();let s=db[q];if(!s){s={general:Math.floor(90+Math.random()*15),redDot:Math.floor(85+Math.random()*15),scope2x:Math.floor(80+Math.random()*15),scope4x:Math.floor(70+Math.random()*15),sniper:Math.floor(48+Math.random()*15),freeLook:Math.floor(85+Math.random()*15),dpi:680};db[q]=s;}document.getElementById('result').innerHTML=`<h2 class='text-3xl mb-6'>${q.toUpperCase()}</h2><div class='grid grid-cols-2 gap-4'>General: ${s.general}<br>Red Dot: ${s.redDot}<br>2x: ${s.scope2x}<br>4x: ${s.scope4x}<br>Sniper: ${s.sniper}<br>Free Look: ${s.freeLook}<br><div class='text-5xl mt-8 text-green-400'>DPI: ${s.dpi}</div></div>`;document.getElementById('result').classList.remove('hidden');}</script></body></html>
